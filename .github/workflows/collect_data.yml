name: Upbit 시세 자동 수집

on:
  schedule:
    - cron: '*/5 * * * *'  
  workflow_dispatch:         

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: 데이터 수집 실행
        run: python src/collector.py

      - name: DB 변경사항 커밋
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/upbit_realtime.db
          git diff --quiet && git diff --staged --quiet || git commit -m "자동 수집: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push